models:
  - name: dim_listings_cleansed
    description: Cleansed dimension table for Airbnb listings.
    data_tests:
      - minimum_row_count:
          arguments:
            min_row_count: 1000
          severity: warn
    columns:
      - name: listing_id
        description: Unique identifier for each listing.
        data_tests:
          - not_null
          - unique
      - name: listing_name
        description: Name of the listing.
        data_tests:
          - not_null
      - name: room_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']
      - name: host_id
        description: Unique identifier for the host.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id
      - name: price
        description: Price per night for the listing.
        data_tests:
          - not_null
      - name: minimum_nights
        description: '{{ doc("dim_listing_cleansed__minimum_nights") }}'
        data_tests:
          - positive_values
  - name: dim_hosts_cleansed
    description: Cleansed dimension table for Airbnb hosts.  
    config:
      contract:
        enforce: true
    columns:
      - name: host_id
        description: Unique identifier for each host.
        data_type: integer
        data_tests:
          - not_null
          - unique
      - name: host_name
        description: Name of the host.
        data_type: string
        data_tests:
          - not_null
      - name: is_superhost
        description: Indicates if the host is a superhost ('t' for true, 'f' for false).
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: ['t', 'f']
      - name: created_at
        data_type: timestamp
        data_tests:
          - not_null
      - name: updated_at
        data_type: timestamp
        data_tests:
          - not_null

  - name: fct_reviews
    columns:
      - name: listing_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_listings_cleansed')
                field: listing_id
      - name: review_date
        data_tests:
          - not_null
      - name: reviewer_name
        data_tests:
          - not_null
      - name: review_text
        data_tests:
          - not_null
      - name: review_sentiment
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['positive', 'negative', 'neutral']

       
  